{% extends "common/base.html" %}

{% block content %}
<img src="{{ url_for('static', filename='images/image1.png') }}" 
     alt="Background" 
     style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; filter: brightness(50%);">

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white text-center py-4">
                <h3 class="mb-0"><i class="bi bi-person-plus-fill"></i> Join AgroSmart</h3>
                <small>Create an account to start farming or buying</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" id="registerForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Choose a display name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light fw-bold">+91</span>
                            <input type="tel" 
                                   id="phoneInput"
                                   name="phone" 
                                   class="form-control" 
                                   placeholder="10-digit mobile number" 
                                   required 
                                   pattern="[6-9]{1}[0-9]{9}"
                                   title="Please enter a valid 10-digit Indian mobile number starting with 6-9">
                        </div>
                        <div class="form-text text-muted small">Example: 9000876549</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Create a strong password" required minlength="6">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Register as:</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                            <select name="role" id="roleSelect" class="form-select" required>
                                <option value="" disabled selected>Select your role...</option>
                                <option value="farmer">Farmer (Produce Crops)</option>
                                <option value="buyer">Buyer (Purchase Crops)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3" id="upiGroup" style="display: none;">
                        <label for="upi_id" class="form-label fw-bold">UPI ID (e.g., name@bank)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-qr-code"></i></span>
                            <input type="text" name="upi_id" id="upi_id" class="form-control" placeholder="Required for Farmers to receive payments">
                        </div>
                        <div class="form-text text-muted small">Farmers must provide this to get paid via QR code.</div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">
                        Create Account
                    </button>
                </form>
            </div>
            <div class="card-footer text-center bg-white py-3">
                <p class="mb-0 text-muted">Already have an account? 
                    <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    // Existing phone input logic
    document.getElementById('phoneInput').addEventListener('input', function (e) {
        var x = e.target.value.replace(/\D/g, '').match(/(\d{0,10})/);
        e.target.value = x[0];
    });

    // Logic to show/hide UPI field based on role
    const roleSelect = document.getElementById('roleSelect');
    const upiGroup = document.getElementById('upiGroup');
    const upiInput = document.getElementById('upi_id');

    roleSelect.addEventListener('change', function() {
        if (this.value === 'farmer') {
            upiGroup.style.display = 'block';
            upiInput.setAttribute('required', 'required');
        } else {
            upiGroup.style.display = 'none';
            upiInput.removeAttribute('required');
        }
    });
</script>

{% endblock %}
