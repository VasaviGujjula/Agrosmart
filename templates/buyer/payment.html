{% extends "common/base.html" %}
{% block content %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
    body {
        background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                    url('https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=1600&q=80');
        background-attachment: fixed; background-size: cover; background-position: center; min-height: 100vh;
    }
    .form-container {
        background: rgba(255, 255, 255, 0.15) !important; 
        backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    #status-msg { animation: pulse 1.5s infinite; font-weight: bold; margin-top: 15px; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    
    .btn-done {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 10px;
        display: none; /* Hidden until payment is confirmed */
        text-transform: uppercase;
    }
</style>

<div class="form-container" style="text-align: center; max-width: 400px; margin: 40px auto; padding: 20px;">
    <h2 style="color: #ffffff;">Secure Checkout</h2>
    <p style="color: #ffffff;">Payment for Contract: <strong>#{{ contract.id }}</strong></p>
    
    <div id="payment-card" style="background: #fff; padding: 20px; border-radius: 15px; margin: 20px 0; border: 2px solid #27ae60; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <h3 style="color: #27ae60; font-size: 28px; margin-bottom: 5px;">₹{{ amount }}</h3>
        <p style="color: #7f8c8d; font-size: 0.9em; margin-bottom: 15px;">UPI, Card, & Netbanking</p>

        <div id="upi-link" style="cursor: pointer;">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa={{ upi_id }}%26pn=Agrosmart%26am={{ amount }}%26cu=INR" 
                 alt="UPI QR Code" style="border: 5px solid #f1f1f1; border-radius: 10px; width: 100%; max-width: 200px;">
        </div>

        <div style="margin-top: 20px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/UPI-Logo.png/640px-UPI-Logo.png" width="60" alt="UPI">
            <p style="font-size: 0.8em; color: #95a5a6; margin-top: 5px;">Scan with GPay, PhonePe, or Paytm</p>
        </div>
    </div>

    <div id="status-msg" style="color: #f1c40f; margin-top: 10px;">
        Waiting for you to scan and pay...
    </div>

    <button type="button" id="manual-verify-btn" class="btn" style="width: 100%; background-color: #f39c12; color: white; padding: 10px; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; font-weight: bold;">
        I HAVE SCANNED AND PAID
    </button>

    <hr style="border-color: rgba(255,255,255,0.2); margin: 20px 0;">

    <button type="button" id="rzp-button" class="btn" style="width: 100%; background-color: #27ae60; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px;">
        PAY WITH RAZORPAY POPUP
    </button>

    <form id="payment-done-form" method="POST" action="{{ url_for('buyer.process_payment', contract_id=contract.id) }}">
        <input type="hidden" name="transaction_id" id="razorpay_payment_id" value="QR_PAYMENT_DEMO">
        <button type="submit" id="done-button" class="btn-done">
            OKAY, PAYMENT DONE
        </button>
    </form>

    <a id="cancel-link" href="{{ url_for('buyer.dashboard') }}" style="color: white; text-decoration: none; font-size: 0.8em; opacity: 0.8;">Cancel Transaction</a>
</div>

<script>
    var cleanAmount = Math.round(parseFloat("{{ amount }}") * 100);

    // --- 1. RAZORPAY AUTOMATIC FLOW ---
    var options = {
        "key": "rzp_test_S6d5JZjvWWfCZG", 
        "amount": cleanAmount, 
        "currency": "INR",
        "name": "Agrosmart FarmHub",
        "description": "Contract Payment #{{ contract.id }}",
        "handler": function (response){
            document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
            showDoneButton("✅ Razorpay Payment Successful!");
        },
        "theme": { "color": "#27ae60" }
    };

    var rzp1 = new Razorpay(options);
    document.getElementById('rzp-button').onclick = function(e){ rzp1.open(); e.preventDefault(); }

    // --- 2. MANUAL QR FLOW ---
    document.getElementById('manual-verify-btn').onclick = function() {
        // Since it's a manual QR scan, we keep the default hidden value "QR_PAYMENT_DEMO"
        showDoneButton("✅ Payment Noted! Click below to confirm.");
    };

    // --- SHARED UI LOGIC ---
    function showDoneButton(message) {
        // Hide initial buttons and QR
        document.getElementById('payment-card').style.opacity = '0.3';
        document.getElementById('rzp-button').style.display = 'none';
        document.getElementById('manual-verify-btn').style.display = 'none';
        document.getElementById('cancel-link').style.display = 'none';

        // Show status and Done button
        var status = document.getElementById('status-msg');
        status.innerHTML = message;
        status.style.color = "#2ecc71";
        status.style.animation = "none";
        
        document.getElementById('done-button').style.display = 'block';
    }
</script>
{% endblock %}
